<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بطاقات الأسواق المالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302f;--teal:#0f5c5a;--teal2:#1b7f7a;--tealL:#e3f1ef;--gold:#b8892f;--goldL:#f7efdc;--rose:#9c3d3d;--roseL:#f6e6e3;--gray:#5d6b6a;--line:#cfe0dd;--bg:#f3f7f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
header h1{font-size:19px;font-weight:900;color:var(--teal);line-height:1.3}
header h1 small{display:block;font-size:12px;font-weight:500;color:var(--gray)}
.btn-menu{border:none;background:var(--teal);color:#fff;font:inherit;font-weight:700;font-size:14px;border-radius:12px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.prog{background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(15,92,90,.08)}
.prog .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--gray);margin-bottom:6px}
.bar{height:8px;background:var(--tealL);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(to left,var(--gold),var(--teal2));border-radius:99px;transition:width .4s}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.lv{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 6px 7px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.lv b{display:block;font-size:12.5px;font-weight:800;line-height:1.3}
.lv span{display:block;font-size:11.5px;color:var(--gray);margin:2px 0 5px}
.lv .mini{height:4px;background:var(--tealL);border-radius:9px;overflow:hidden}.lv .mini i{display:block;height:100%;background:var(--teal2)}
.lv.on{border-color:var(--teal);background:var(--tealL);box-shadow:0 0 0 2px rgba(15,92,90,.15)}
.lv.lock{opacity:.5}
.lv .badge{position:absolute;top:-7px;left:-5px;background:var(--gold);color:#fff;border-radius:99px;font-size:11px;width:20px;height:20px;line-height:20px;font-weight:900}
.card{background:#fff;border-radius:22px;box-shadow:0 4px 18px rgba(15,92,90,.10);overflow:hidden;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.card .strip{height:6px;background:linear-gradient(to left,var(--gold),var(--teal2),var(--teal))}
.card .in{padding:16px 18px 18px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:12.5px}
.chap{background:var(--goldL);color:#7a5a16;font-weight:800;border-radius:99px;padding:3px 10px}
.pos{color:var(--gray);font-weight:500}
.card h2{font-size:20px;font-weight:900;color:var(--teal);line-height:1.45;margin-bottom:8px}
.done-tag{display:inline-block;font-size:12px;background:#d6ede6;color:#0c5b45;border-radius:99px;padding:1px 9px;font-weight:800;margin-bottom:8px}
.body{font-size:16.5px;line-height:1.85}
.body ul,.body ol{padding-right:20px;margin:4px 0}.body li{margin-bottom:3px}
.body table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;line-height:1.55;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0}
.body th{background:var(--teal);color:#fff;padding:6px 8px;text-align:right;font-weight:700}
.body td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.body tr:nth-child(even) td{background:#f5faf9}.body td:first-child{font-weight:700;color:var(--teal)}
.k{background:var(--teal);color:#fff;border-radius:6px;padding:0 6px;font-weight:700}
.v{color:#7a5a16;font-weight:700}
.ok,.no,.kh{display:inline-block;border-radius:6px;padding:0 6px;font-weight:800;font-size:.92em;line-height:1.6}
.ok{background:#d6ede6;color:#0c5b45}.no{background:var(--roseL);color:var(--rose)}.kh{background:var(--goldL);color:#7a5a16}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{font:inherit;border:none;border-radius:14px;cursor:pointer;font-weight:800}
#ok{flex:1;background:var(--teal);color:#fff;font-size:17px;padding:14px}
#later{background:var(--tealL);color:var(--teal);font-size:15px;padding:14px 16px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13.5px;color:var(--gray)}
.sub button{font:inherit;background:none;border:none;color:var(--teal2);font-weight:700;cursor:pointer;padding:4px}
.sub button:disabled{opacity:.35;cursor:default}
.finish{text-align:center;padding:28px 18px}
.finish .em{font-size:52px}
.finish h2{font-size:22px;margin:8px 0}
.finish p{color:var(--gray);line-height:1.8;margin-bottom:16px}
.finish button{display:block;width:100%;font:inherit;font-weight:800;border:none;border-radius:14px;padding:13px;margin-top:8px;cursor:pointer}
.finish .p{background:var(--teal);color:#fff;font-size:16px}.finish .s{background:var(--tealL);color:var(--teal)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,30,30,.45);display:none;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;max-height:82vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s;z-index:41}
.sheet.open{transform:none}.sheet-bg.open{display:block}
.sheet .hd{padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.sheet .hd b{font-size:16px;color:var(--teal)}
.sheet .hd button{font:inherit;border:none;background:var(--tealL);color:var(--teal);border-radius:10px;padding:5px 12px;font-weight:700;cursor:pointer}
.sheet .list{overflow:auto;padding:6px 10px}
.it{display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:12px;cursor:pointer;font-size:14.5px}
.it:hover{background:var(--bg)}.it.cur{background:var(--tealL)}
.it .st{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.it.d .st{background:var(--teal2);border-color:var(--teal2);color:#fff}
.it small{color:var(--gray);display:block;font-size:12px}
.sheet .ft{padding:10px 16px 16px;border-top:1px solid var(--line)}
.reset{width:100%;font:inherit;border:1.5px solid var(--rose);color:var(--rose);background:#fff;border-radius:12px;padding:10px;font-weight:800;cursor:pointer}
.confirm{display:none;margin-top:8px;background:var(--roseL);border-radius:12px;padding:10px;text-align:center;font-size:14px}
.confirm.show{display:block}
.confirm button{font:inherit;font-weight:800;border:none;border-radius:10px;padding:7px 16px;margin:6px 4px 0;cursor:pointer}
.confirm .y{background:var(--rose);color:#fff}.confirm .n{background:#fff;color:var(--ink)}
.proglink{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;font-size:12px;color:#5d6b6a;line-height:1.5}.proglink button{flex:none;font:inherit;font-size:12.5px;font-weight:800;color:#0f5c5a;background:#e3f1ef;border:1px solid #cfe0dd;border-radius:99px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
 <header><h1>بطاقات الأسواق المالية<small>مقرر 5205 قصد · ذاكر بطاقة بطاقة</small></h1><button class="btn-menu" id="menuBtn">☰ القائمة</button></header>
 <div class="prog"><div class="row"><span>التقدم الكلي</span><span id="totTxt"></span></div><div class="bar"><i id="totBar"></i></div></div>
 <div class="levels" id="levels"></div><div class="proglink"><button id="progBtn" type="button">🔗 انسخ رابط تقدّمك</button><span>احفظه في المفضلة: يعيدك إلى موضعك وما أنجزته ولو مُسح حفظ المتصفح</span></div>
 <div id="stage"></div>
</div>
<div id="toast"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
 <div class="hd"><b id="sheetTitle"></b><button id="closeSheet">إغلاق</button></div>
 <div class="list" id="list"></div>
 <div class="ft"><button class="reset" id="resetBtn">إعادة تعيين تقدّم هذا المستوى</button>
  <div class="confirm" id="confirm">سيُمسح تقدّمك في هذا المستوى. متأكد؟<br><button class="y" id="yes">نعم، امسح</button><button class="n" id="no">تراجع</button></div></div>
</div>
<script>
const LEVELS=[{n:1,name:"الصورة الكبرى"},{n:2,name:"المفاهيم"},{n:3,name:"التفاصيل"},{n:4,name:"الإتقان"}];
const C=[
// ================= المستوى 1: الصورة الكبرى (10) =================
[1,"الفصل 1","ما السوق المالية؟","هي <b>الإطار</b> الذي يلتقي فيه بائعو الأدوات المالية ومشتروها، ولو بلا مكان مادي.<br>ما يُباع فيها ليس سلعًا، بل <span class='k'>أدوات مالية</span>: أسهم، سندات، صكوك، وحدات صناديق، مشتقات."],
[1,"الفصل 1","لماذا توجد؟ وما حكمها؟","وظيفتها الجوهرية: <b>نقل الفائض المالي</b> من أصحاب المدخرات إلى أصحاب الحاجة للتمويل.<br>وحكمها في الأصل <span class='ok'>الإباحة</span>؛ فالمرفوض بعض أدواتها وبعض صور التعامل فيها، لا السوق ذاتها."],
[1,"الفصل 1","كيف تُقسَّم الأسواق؟","أربعة تقسيمات:<ul><li>بموعد التسليم: <b>حاضرة</b> وآجلة</li><li>بأجل الأداة: <b>نقد</b> (سنة فأقل) و<b>رأس مال</b></li><li>بمرحلة الإصدار: <b>أولية</b> و<b>ثانوية</b></li><li>بنوع الأداة: أسهم، دين، عملات، سلع، مشتقات</li></ul>"],
[1,"الفصل 2","الأسهم في سطرين","السهم = <span class='k'>حصة شائعة</span> في رأس مال شركة مساهمة، فحامله <b>شريك</b>.<br>حكمه بحسب نشاط الشركة: النقية <span class='ok'>جائزة</span>، والمحرمة <span class='no'>محرمة</span>، والمختلطة <span class='kh'>خلاف</span>."],
[1,"الفصل 2","السندات في سطرين","السند = <span class='k'>قرض</span> بفائدة، فحامله <b>دائن</b> والمُصدر مدين.<br>حكمها: <span class='no'>محرمة</span> إصدارًا وتداولًا باتفاق المجامع؛ لأنها قرض جرّ نفعًا."],
[1,"الفصل 2","الصكوك في سطرين","الصك = <span class='k'>ملكية حقيقية</span> لحصة في أصول أو منافع أو مشروع، بلا ضمان لرأس المال.<br>حكمها: <span class='ok'>جائزة</span> بضوابطها، وهي البديل الشرعي للسندات."],
[1,"الفصل 2","الصناديق وأدوات النقد","<b>الصناديق:</b> استثمار جماعي يديره مدير بأجر، مقسوم إلى وحدات ← <span class='ok'>جائزة</span> إن كانت أصولها مباحة.<br><b>أذون الخزانة وشهادات الإيداع:</b> قروض قصيرة بفائدة ← <span class='no'>محرمة</span>."],
[1,"الفصل 3","المعاملات في السوق","<ul><li><b>العاجلة:</b> بيع وشراء بسعر اليوم ← <span class='ok'>جائزة</span></li><li><b>الشراء بالهامش:</b> شراء بمال مقترض جزئيًّا ← بحسب طريقة التمويل</li><li><b>البيع على المكشوف:</b> بيع أسهم مقترضة ← <span class='no'>محرم</span></li></ul>"],
[1,"الفصل 4","المشتقات المالية","عقود <b>تُشتق قيمتها</b> من أصل آخر: الآجلة، والمستقبلية، والخيارات، والمبادلات.<br>حكمها إجمالًا: <span class='no'>محرمة</span> (تأجيل البدلين، والغرر، والمقامرة)، ولها بدائل شرعية كالسلم والعربون."],
[1,"الفصلان 5 و6","التداول والسوق السعودية","<b>آليات التداول:</b> الوسيط، وصانع السوق، والأوامر، والمقاصة والتسوية، والمؤشرات.<br><b>السوق السعودية:</b> هيئة السوق المالية تنظّم، ومجموعة تداول تشغّل، ولجان المنازعات تفصل."],

// ================= المستوى 2: المفاهيم (20) =================
[2,"الفصل 1","تعريف السوق المالية","<b>لغة:</b> موضع البياعات؛ لأن التجارة تُساق إليها.<br><b>اصطلاحًا:</b> الإطار الذي يجمع بائعي الأدوات المالية ومشتريها بصرف النظر عن المكان، مع قنوات اتصال فعالة تجعل الأسعار السائدة في أي لحظة <b>واحدة</b> لأي أداة.<br><b>الأوراق المالية ثلاثة:</b> أدوات ملكية (أسهم، حقوق أولوية، وحدات) · أدوات دين (سندات، صكوك) · مشتقات."],
[2,"الفصل 1","سوق النقد وسوق رأس المال","<b>سوق النقد:</b> تُتداول فيها أدوات قصيرة الأجل <b>لا تزيد على سنة</b>، سيولتها عالية ومخاطرتها منخفضة، ومتعاملوها البنوك والمؤسسات الكبيرة.<br><b>سوق رأس المال:</b> أدوات متوسطة وطويلة الأجل <b>تزيد على سنة</b>، تموّل الاستثمار طويل الأجل: أسهم، سندات، صكوك، وحدات."],
[2,"الفصل 1","السوق الأولية والثانوية","<b>الأولية (الإصدار):</b> تُطرح فيها الأوراق الجديدة لأول مرة، فيذهب المال إلى <b>المُصدر</b> مباشرة، كالاكتتاب العام.<br><b>الثانوية (التداول):</b> تُتداول فيها الأوراق بين المستثمرين، ولا يأخذ المُصدر شيئًا، لكنها تعطي الأوراق <b>السيولة</b> التي تشجع على الاكتتاب."],
[2,"الفصل 2","تعريف السهم وخصائصه","<b>لغة:</b> النصيب. <b>اصطلاحًا:</b> صك يمثل حصة شائعة في رأس مال شركة مساهمة، قابل للتداول، ويخوّل مالكه حقوقًا بقدر حصته.<br><b>خصائصه:</b> متساوي القيمة · قابل للتداول · لا يتجزأ أمام الشركة · مسؤولية مالكه محدودة بقيمته."],
[2,"الفصل 2","قيم السهم الأربع","<table><tr><td>الاسمية</td><td>المدونة عند الإصدار (10 ريالات غالبًا)</td></tr><tr><td>الدفترية</td><td>حقوق المساهمين ÷ عدد الأسهم</td></tr><tr><td>السوقية</td><td>سعر التداول بالعرض والطلب</td></tr><tr><td>الحقيقية</td><td>تقدير المحلل بالأرباح المتوقعة والمخاطر</td></tr></table>"],
[2,"الفصل 2","أنواع الأسهم","حدد نظام الشركات السعودي (<b>المادة 108</b>) ثلاثة أنواع:<ul><li><b>العادية:</b> يتساوى حملتها في الحقوق والالتزامات، وهي الأصل</li><li><b>الممتازة:</b> لها امتيازات تفضيلية، ولا تعطي حق التصويت</li><li><b>القابلة للاسترداد:</b> تستردها الشركة بخيارها</li></ul>"],
[2,"الفصل 2","الشركات الثلاث وحكم أسهمها","<table><tr><td>النقية</td><td>نشاط مباح بلا محرم ← <span class='ok'>جائز</span> بالاتفاق</td></tr><tr><td>محرمة النشاط</td><td>بنوك ربوية، خمور، قمار، تأمين تجاري ← <span class='no'>محرم</span></td></tr><tr><td>المختلطة</td><td>نشاط مباح مع اقتراض أو إيداع ربوي أو كسب محرم يسير ← <span class='kh'>خلاف</span></td></tr></table>"],
[2,"الفصل 2","المختلطة: من قال بماذا؟","<b>القول الأول: التحريم</b> ← اللجنة الدائمة، والمجمع (قرار 63)، والمجمع الفقهي برابطة العالم الإسلامي.<br><b>القول الثاني: الجواز بضوابط مع التطهير</b> ← المعايير الشرعية (معيار 21)، ومعظم اللجان الشرعية للمصارف الإسلامية."],
[2,"الفصل 2","تعريف السند","صك قابل للتداول يمثل <span class='k'>قرضًا</span> طويل الأجل غالبًا، تصدره الحكومة أو الشركة، ويلتزم المُصدر بدفع <b>فائدة دورية</b> لحامله، ورد <b>القيمة الاسمية</b> عند الاستحقاق.<br>فحامل السند <b>دائن</b>، والمُصدر <b>مدين</b>."],
[2,"الفصل 2","تعريف الصكوك","عرفتها المعايير الشرعية (<b>معيار 17</b>): «وثائق متساوية القيمة تمثل <span class='k'>حصصًا شائعة</span> في ملكية أعيان أو منافع أو خدمات، أو في موجودات مشروع معين أو نشاط استثماري خاص، وذلك بعد تحصيل قيمة الصكوك وقفل باب الاكتتاب وبدء استخدامها فيما أُصدرت من أجله»."],
[2,"الفصل 2","تعريف الصناديق الاستثمارية","عرّفها نظام السوق المالية: «برنامج استثمار مشترك يهدف إلى إتاحة الفرصة للمستثمرين فيه بالمشاركة جماعيًّا في أرباح البرنامج، ويديره مدير الاستثمار مقابل رسوم محددة».<br>ويُقسم إلى حصص متساوية تسمى <span class='k'>الوحدات</span>، وكل وحدة حق ملكية لحاملها."],
[2,"الفصل 2","أذون الخزانة وشهادات الإيداع","<b>أذون الخزانة:</b> أدوات دين <b>حكومية</b> قصيرة الأجل (لا تتجاوز سنة)، تُباع <b>بخصم</b> من قيمتها الاسمية وتُسترد كاملة.<br><b>شهادات الإيداع:</b> وثيقة يصدرها <b>البنك</b> تثبت إيداع مبلغ لديه لمدة محددة <b>بفائدة</b> محددة، وتكون غالبًا قابلة للتداول."],
[2,"الفصل 3","المعاملات العاجلة","صفقات بسعر اليوم، يتم فيها التسليم ودفع الثمن فورًا أو خلال مدة جرى بها العرف والنظام تسمى <span class='k'>دورة التسوية</span> (T+n)، وهي في السوق السعودية <b>يوما عمل (T+2)</b>.<br>حكمها: <span class='ok'>جائزة</span> في الأسهم المباحة؛ لأنها بيع تام الأركان."],
[2,"الفصل 3","تعريف الشراء بالهامش","شراء الورقة المالية بسداد جزء من قيمتها نقدًا من مال المستثمر (وهو <span class='k'>الهامش</span>)، وتمويل الباقي من <b>الوسيط المالي</b>، بضمان الأوراق محل الصفقة التي تبقى <b>مرهونة</b> لديه."],
[2,"الفصل 3","تعريف البيع على المكشوف","ويسمى البيع القصير: بيع ورقة مالية <b>مقترضة</b> من طرف آخر توقعًا <b>لانخفاض</b> سعرها، ثم شراؤها لاحقًا بسعر أقل وردها إلى المقرض، فيربح الفرق مخصومًا منه عمولة الاقتراض.<br>وهو عكس الشراء بالهامش."],
[2,"الفصل 4","المشتقات وأغراضها","<b>المشتقات:</b> عقود تُشتق قيمتها من قيمة أصل آخر يسمى «الأصل محل التعاقد»، كالأسهم والسلع والعملات والمؤشرات ومعدلات الفائدة.<br><b>أغراضها:</b> ① <b>التحوط</b> من تقلب الأسعار ② <b>المضاربة</b> (المجازفة)، وهو الغالب ③ <b>المراجحة</b> بين سوقين."],
[2,"الفصل 4","الآجلة والمستقبلية","<b>العقد الآجل:</b> اتفاق على بيع أصل وشرائه في تاريخ مستقبلي بسعر يُحدد الآن، ويؤجل فيه التسليم والثمن معًا.<br><b>العقد المستقبلي:</b> عقد <b>نمطي</b> يُتداول في سوق منظمة، يلتزم فيه طرف بالتسليم في موعد التصفية والآخر بدفع الثمن المحدد؛ ويسمى «العقد الآجل البات»."],
[2,"الفصل 4","عقد الخيار","عقد يمنح مشتريه <span class='k'>الحق لا الالتزام</span> في شراء أصل معين أو بيعه، بسعر محدد (<b>سعر التنفيذ</b>)، خلال مدة محددة أو في تاريخ معين، مقابل مبلغ يدفعه لمحرر الخيار يسمى <b>العلاوة</b>، لا يُرد سواء نُفّذ الخيار أم لم يُنفذ."],
[2,"الفصل 5","الوسيط وصانع السوق","<b>الوسيط المالي:</b> شخص مرخص ينفذ أوامر العملاء بالبيع والشراء نيابة عنهم مقابل <b>عمولة</b> معلومة.<br><b>صانع السوق:</b> شخص مرخص يلتزم بتقديم أسعار شراء وبيع <b>مستمرة</b> لورقة معينة، مستعد للتعامل بها في حدود كميات محددة؛ وربحه الفرق بين السعرين."],
[2,"الفصل 6","مؤسسات السوق السعودية","<ul><li><b>هيئة السوق المالية:</b> الجهة الحكومية المنظمة والمشرفة</li><li><b>تداول السعودية:</b> الجهة الوحيدة للإدراج والتداول</li><li><b>إيداع:</b> تسجيل الملكية وحفظها والتسوية</li><li><b>مقاصة:</b> الطرف المقابل المركزي</li><li><b>وامض:</b> الحلول التقنية والبيانات</li><li><b>لجان المنازعات:</b> الفصل ثم الاستئناف</li></ul>"],

// ================= المستوى 3: التفاصيل (30) =================
[3,"الفصل 1","وظائف السوق الست","تتفرع عن نقل الفائض المالي:<ol><li>تعبئة المدخرات وتوجيهها للاستثمار بدل اكتنازها</li><li>توفير السيولة لحاملي الأوراق</li><li>اكتشاف الأسعار بالعرض والطلب</li><li>الدلالة على حالة الاقتصاد</li><li>توزيع المخاطر وتنويعها</li><li>الرقابة على أداء الشركات عبر الإفصاح</li></ol>"],
[3,"الفصل 1","نظرة الاقتصاد الإسلامي","الأصل <span class='ok'>الإباحة</span>؛ لأنها وسيلة لتداول الأموال، والأصل في المعاملات الحل، والشريعة جاءت بتداول المال: <span class='v'>﴿كَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنكُمْ﴾ [الحشر: 7]</span>.<br><b>القيود:</b> أن تكون الأدوات مباحة في ذاتها، وتخلو المعاملات من الربا والغرر الفاحش والقمار والغش والتلاعب بالأسعار."],
[3,"الفصل 1","نشأة السوق السعودية: 4 مراحل","<ol><li><b>التداول غير المنظم:</b> بدأ بأول شركة مساهمة، وتداول مباشر أو عبر مكاتب غير مرخصة</li><li><b>إشراف مؤسسة النقد:</b> لجنة وزارية، وقصر التداول على البنوك</li><li><b>التداول الإلكتروني:</b> أول نظام، ثم نظام «تداول»</li><li><b>الهيئة المستقلة:</b> صدور نظام السوق وإنشاء الهيئة، ثم شركة تداول</li></ol>"],
[3,"الفصل 1","أدوات سوق النقد","<ul><li><b>أذون الخزانة:</b> دين حكومي قصير يُباع بخصم</li><li><b>شهادات الإيداع:</b> إيداع لدى بنك بفائدة</li><li><b>القبولات المصرفية:</b> كمبيالات يتعهد البنك بدفعها فتصبح قابلة للتداول</li><li><b>الأوراق التجارية:</b> سندات دين قصيرة تصدرها الشركات الكبيرة</li><li><b>الريبو:</b> بيع ورقة مع الاتفاق على إعادة شرائها بأعلى؛ وحقيقتها قرض بضمان</li><li><b>ما بين البنوك:</b> إقراض قصير جدًّا</li></ul>"],
[3,"الفصل 1","مكونات السوق الأولية","<b>طريقتا الإصدار:</b> طرح عام للجمهور، وطرح خاص لمستثمرين مؤهلين.<br><b>أطرافها:</b> المُصدر، مدير الاكتتاب، متعهد التغطية، البنوك المستلمة، المكتتبون.<br><b>أنواع الاكتتاب:</b><ol><li>شركة تحت التأسيس: بالقيمة الاسمية، والمال للشركة</li><li>زيادة رأس المال: بالاسمية مع علاوة إصدار، والأولوية للمساهمين</li><li>تحويل شركة مقفلة إلى مدرجة: المال <b>للبائعين</b> لا للشركة؛ فحقيقته بيع</li></ol>"],
[3,"الفصل 1","مكونات السوق الثانوية","<b>المنظمة (البورصة):</b> مكان أو نظام محدد، وقواعد إدراج، وأوراق مدرجة فقط، ووسطاء مرخصون؛ كتداول السعودية.<br><b>غير المنظمة (OTC):</b> تعامل مباشر أو عبر شبكات في أوراق غير مدرجة غالبًا، ويتفرع عنها:<ul><li><b>السوق الثالث:</b> أوراق مدرجة تُتداول خارج البورصة عبر سماسرة غير أعضاء، للصفقات الكبيرة</li><li><b>السوق الرابع:</b> تعامل مباشر بين المؤسسات الكبيرة <b>دون وسيط</b> توفيرًا للعمولات</li></ul>"],
[3,"الفصل 2","خصائص شركات المساهمة السبع","<ol><li>رأس مال مقسم إلى أسهم متساوية</li><li>المسؤولية المحدودة بقدر قيمة الأسهم</li><li>تداول الأسهم دون موافقة بقية الشركاء</li><li>السهم لا يتجزأ أمام الشركة</li><li>شخصية اعتبارية وذمة مستقلة</li><li>انفصال الملكية عن الإدارة</li><li>لا تتأثر بموت المساهم؛ فهي شركة أموال</li></ol>"],
[3,"الفصل 2","التكييف الفقهي للشركة والسهم","<b>الشركة:</b> عند أكثر المعاصرين شركة جديدة مباحة، تُخرّج على <b>شركة العنان</b>. والمسؤولية المحدودة جائزة لأنها شرط معلن.<br><b>السهم، اتجاهان:</b><ol><li><b>حصة مشاعة في موجودات الشركة:</b> قرار المجمع 63 (7/1)، والمعايير</li><li><b>ورقة تثبت حقوقًا</b> لا حصة في الموجودات: نظام الشركات (م107) والقضاء؛ فهي أموال منقولة ولو في شركة عقارية، ولا شفعة فيها</li></ol>"],
[3,"الفصل 2","العادية مقابل الممتازة","<table><tr><th></th><th>العادية</th><th>الممتازة</th></tr><tr><td>التصويت</td><td>نعم</td><td>لا</td></tr><tr><td>الربح</td><td>بقدر الحصة</td><td>امتياز فيه</td></tr><tr><td>التصفية</td><td>بعد الدائنين بالتساوي</td><td>قد تُقدّم</td></tr><tr><td>الإصدار</td><td>التأسيس والزيادة</td><td>بنص النظام الأساس، غالبًا عند الزيادة</td></tr><tr><td>الحكم</td><td><span class='ok'>جائزة</span></td><td>بحسب الامتياز</td></tr></table>"],
[3,"الفصل 2","حكم الأسهم الممتازة","<span class='no'>محرم اتفاقًا</span> الامتياز الذي يؤدي إلى <b>ضمان</b> رأس المال أو قدر من الربح، أو الأولوية في استرداد رأس المال عند التصفية؛ لمنافاته المشاركة في الغنم والغرم.<br><span class='kh'>خلاف</span> الامتياز في <b>قسمة الربح المتحقق</b> دون ضمان: التحريم (ظاهر قرار المجمع 63) أو الجواز (المعايير).<br><b>الراجح:</b> <span class='ok'>الجواز</span>؛ لانتفاء الضمان وبقاء المشاركة."],
[3,"الفصل 2","أدلة المحرّمين في المختلطة","<ol><li>عموم نصوص تحريم الربا قليله وكثيره: <span class='v'>﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾ [البقرة: 275]</span></li><li>تحريم التعاون على الإثم، ولعن النبي ﷺ آكل الربا وموكله وكاتبه وشاهديه (رواه مسلم)، والمساهم معين</li><li>الشركة وكيلة عن المساهم، ويدها كيده، والمال ماله</li></ol>"],
[3,"الفصل 2","أدلة المجيزين في المختلطة","<ol><li>قاعدة «<b>يُغتفر في التابع ما لا يُغتفر في المتبوع</b>»، وعموم البلوى والحاجة</li><li>للشركة شخصية اعتبارية وذمة مستقلة؛ فإذا كان الأغلب مباحًا واختلط بمحرم يسير يمكن تمييزه لم يحرم الحلال الأغلب</li><li>القرارات في الشركة بالأغلبية، فلا يُنسب للمساهم المعترض إذن أو موافقة</li></ol>"],
[3,"الفصل 2","ضوابط الشركات المختلطة","<table><tr><th>الضابط</th><th>بعض اللجان (المحرر)</th><th>أيوفي</th></tr><tr><td>النشاط</td><td>مباح</td><td>مباح</td></tr><tr><td>القروض الربوية</td><td>أقل من 30% من القيمة السوقية</td><td rowspan='2'>الاقتراض أو الإيداع المحرم ≤ الثلث من القيمة السوقية أو الموجودات أيهما أعلى</td></tr><tr><td>الودائع الربوية</td><td>أقل من 30%</td></tr><tr><td>الإيراد المحرم</td><td>≤ 5%</td><td>≤ 5%</td></tr><tr><td>التطهير</td><td colspan='2'>واجب مهما قلّت النسبة</td></tr></table>"],
[3,"الفصل 2","التطهير: الحساب والمصرف","<b>الإيراد المحرم:</b> كسب الشركة المختلطة من مصدر محرم كفوائد الودائع، ويجب التخلص منه مهما قل.<br><b>الحساب:</b> <span class='k'>(الإيراد المحرم ÷ عدد الأسهم) × الأسهم المملوكة</span><br><b>مثال:</b> 2 مليون ÷ 10 ملايين = 0.20 ريال، فمن يملك 1,000 سهم يطهّر <b>200 ريال</b>.<br><b>مصرفه:</b> وجوه البر، دون انتفاع، ولا يُحتسب من الزكاة، ولا يدفع به ضريبة أو التزامًا عليه."],
[3,"الفصل 2","حق الأولوية","<b>تعريفه:</b> ورقة مالية قابلة للتداول تعطي حاملها أحقية الاكتتاب في الأسهم الجديدة بسعر الطرح عند زيادة رأس المال، وتُمنح للمساهمين المقيدين نهاية يوم الاستحقاق بنسبة ما يملكون.<br><b>آليته:</b> موافقة الجمعية غير العادية ← إيداع الحقوق وتعديل سعر السهم ← فترة التداول والاكتتاب.<br><b>حكمه:</b> <span class='k'>حق مجرد</span> <span class='ok'>يجوز تداوله</span> متى كانت الأسهم المطروحة جائزة."],
[3,"الفصل 2","أنواع السندات","<table><tr><td>الجهة المُصدرة</td><td>حكومية، شركات، بلديات</td></tr><tr><td>حساب العائد</td><td>فائدة ثابتة، أو متغيرة مرتبطة بسايبور</td></tr><tr><td>دفع العائد</td><td>بكوبون دوري، أو صفرية تُباع بخصم</td></tr><tr><td>الضمان</td><td>مضمونة برهن، وغير مضمونة</td></tr><tr><td>خصائص إضافية</td><td>قابلة للتحويل لأسهم، قابلة للاستدعاء، سندات الجوائز</td></tr></table>"],
[3,"الفصل 2","لماذا حُرّمت السندات؟","<ul><li><b>في الإصدار:</b> قرض بزيادة مشروطة، و«كل قرض جر نفعًا مشروطًا فهو ربا» بالإجماع</li><li><b>في التداول:</b> السند دين مؤجل، فبيعه بنقد أقل أو أكثر يجمع ربا الفضل والنسيئة</li><li><b>في الصفرية:</b> الخصم عند الإصدار هو الفائدة نفسها وإن لم تُسمّ</li><li><b>في سندات الجوائز:</b> تجمع الربا والقمار</li></ul>"],
[3,"الفصل 2","أنواع الصكوك وحكم تداولها","<table><tr><td>الإجارة</td><td><span class='ok'>يجوز</span> بالسعر المتراضى عليه</td></tr><tr><td>المنافع والخدمات</td><td><span class='ok'>يجوز</span> بشروط عقودها</td></tr><tr><td>المضاربة، المشاركة، الوكالة</td><td><span class='ok'>يجوز</span> بعد بدء النشاط</td></tr><tr><td>المرابحة</td><td><span class='no'>لا يجوز</span> بعد بيع السلعة</td></tr><tr><td>السلم</td><td><span class='no'>لا يجوز</span> قبل قبض المسلَم فيه</td></tr><tr><td>الاستصناع</td><td>بحسب ما تمثله</td></tr><tr><td>المركبة</td><td><span class='ok'>يجوز</span> إذا كانت المرابحة أقل من 50%</td></tr></table>"],
[3,"الفصل 2","ضوابط الصكوك الخمسة","<ol><li>تمثل <b>ملكية حقيقية</b> تنتقل بها المخاطر والعوائد، لا مجرد حق في التدفقات النقدية</li><li>لا يضمن المُصدر أو المدير رأس المال أو الربح إلا بالتعدي أو التقصير</li><li>لا يتعهد المُصدر بشراء الأصول بالقيمة <b>الاسمية</b>، بل السوقية أو بما يُتفق عليه عند الشراء</li><li>مراعاة طبيعة الموجودات في التداول</li><li>محل مباح، والحصيلة في نشاط مشروع</li></ol>"],
[3,"الفصل 2","الصكوك مقابل السندات","<table><tr><th></th><th>الصكوك</th><th>السندات</th></tr><tr><td>الطبيعة</td><td>ملكية أصول</td><td>دين على المُصدر</td></tr><tr><td>العقد</td><td>إجارة، مضاربة...</td><td>قرض بفائدة</td></tr><tr><td>العائد</td><td>من غلة الأصل</td><td>فائدة منسوبة للقرض</td></tr><tr><td>رأس المال</td><td>غير مضمون</td><td>مضمون</td></tr><tr><td>الأصل</td><td>لا بد منه</td><td>لا يُشترط</td></tr><tr><td>التداول</td><td>بحسب الموجودات</td><td>بأي سعر</td></tr><tr><td>الحكم</td><td><span class='ok'>جائزة</span></td><td><span class='no'>محرمة</span></td></tr></table>"],
[3,"الفصل 2","أنواع الصناديق","<ul><li><b>الإتاحة:</b> عامة (وحدات منخفضة) · خاصة (مؤهلون بحد أدنى مرتفع)</li><li><b>رأس المال:</b> مفتوحة (يتغير، بلا مدة) · مغلقة (محددة رأس المال والمدة)</li><li><b>التداول:</b> متداولة (الريت، ETFs، الذهب) · غير متداولة</li><li><b>السياسة:</b> النمو · الدخل · المتوازنة</li><li><b>التوافق الشرعي:</b> متوافقة لها رقابة · غير متوافقة</li></ul>"],
[3,"الفصل 2","تكييف الصناديق وضوابطها","يُكيَّف على <b>الوكالة بالاستثمار بأجر</b> (الغالب)، أو <b>المضاربة</b> إن أخذ المدير نسبة من الربح.<ol><li>أصول مباحة، مع ضوابط المختلطة والتطهير</li><li>لا يضمن المدير رأس المال ولا ربحًا إلا بالتعدي أو التقصير</li><li>أجرة المدير أو نصيبه معلوم</li><li>هيئة شرعية تراقب</li><li>تُتداول وحدات الصناديق ذات النشاط المستمر بالتبعية</li></ol>"],
[3,"الفصل 3","مصطلحات الشراء بالهامش","<ul><li><b>الهامش المبدئي:</b> ما يدفعه المستثمر عند الشراء، ولا يقل عادة عن <b>50%</b>، وترفعه الجهات الإشرافية عند اشتداد المضاربات وتخفضه عند الركود</li><li><b>هامش الوقاية (الصيانة):</b> حد أدنى مستمر لحقوق المستثمر</li><li><b>نداء الهامش:</b> طلب إيداع مبلغ إضافي إذا نزل عن هامش الوقاية، فإن لم يفعل باع الوسيط الأوراق</li><li>الأسهم ملك العميل: له التصويت والنماء، وعليه الخسارة</li></ul>"],
[3,"الفصل 3","حكم صور تمويل الهامش","<table><tr><td>قرض بفائدة</td><td><span class='no'>محرم</span>؛ ربا النسيئة (مجمع الرابطة، الدورة 18)</td></tr><tr><td>المرابحة</td><td><span class='ok'>جائز</span>: يتملك الوسيط الأسهم ثم يبيعها بثمن مؤجل معلوم، ويجوز رهنها لديه</td></tr><tr><td>قرض بلا فائدة</td><td><span class='ok'>جائز بشرطين</span>: الرسوم بقدر التكلفة الفعلية، والعمولة مثل عمولة غيره؛ وإلا فحيلة «لا يحل سلف وبيع»</td></tr></table>"],
[3,"الفصل 3","حكم البيع على المكشوف","<b>① العاري:</b> <span class='no'>محرم</span>؛ بيع ما لا يملك: «لا تبع ما ليس عندك» (أبو داود والترمذي والنسائي)، وقرار المجمع 63.<br><b>② المغطى:</b> اتجاهان: <b>قرض أسهم</b> فيحرم (لا يجوز إقراض الأسهم لتعذر رد المثل، والعمولة قرض جر نفعًا)، أو <b>مقايضة</b> أسهم بمثلها مؤجلة.<br><b>الراجح:</b> تحريم صورته السائدة (المجمع والمعايير)، مع إمكان تصحيحه بصيغة الوعد."],
[3,"الفصل 4","خصائص العقود المستقبلية الست","<ol><li><b>النمطية:</b> لا يُتفاوض إلا على السعر</li><li><b>التداول في سوق منظمة</b> قبل الموعد</li><li><b>غرفة المقاصة</b> طرف مقابل لكل بائع ومشترٍ</li><li><b>هامش مبدئي</b> (≤ 15% عادة) وتسوية يومية</li><li><b>التصفية بعقد معاكس:</b> أكثر من 97% دون تسليم</li><li>قد يكون محلها <b>مؤشرًا</b> فتُسوى نقدًا</li></ol>"],
[3,"الفصل 4","لماذا حُرّمت المستقبلية؟","قرار المجمع 63 (7/1) والمعايير، لأربعة أوجه:<ol><li>بيع الدين بالدين لتأجيل البدلين</li><li>تداول المعقود عليه قبل قبضه، والبائع يبيع غالبًا ما لا يملك</li><li>مقامرة على فروق الأسعار؛ وتظهر جليًّا في عقود المؤشرات</li><li>الفوائد على الهامش، وبدل التأجيل</li></ol><b>البديل:</b> السلم بتعجيل الثمن كاملًا."],
[3,"الفصل 4","الخيارات: القولان","<b>① التحريم</b> (المجمع 63 والمعايير): الغرر الفاحش والقمار، وبيع ما ليس عنده، وعقود صورية بالتسوية النقدية، والحق ليس مالًا متقومًا.<br><b>② جواز المفردة بضوابط</b> (بعض اللجان في المملكة): الغرر منتفٍ، والحق متقوم كالارتفاق، واستأنسوا بالعربون.<br><b>الراجح:</b> تحريمها كما تجري عالميًّا، والمفرد المغطى بالتسليم الفعلي <span class='kh'>محل اجتهاد</span>."],
[3,"الفصل 5","خطوات التداول الأربع","<ol><li><b>فتح حساب</b> ومحفظة لدى وسيط مرخص، وربطها بحساب بنكي</li><li><b>إصدار الأمر</b> عبر منصة الوسيط: الورقة، الكمية، السعر، المدة</li><li><b>التنفيذ (المطابقة):</b> يطابقه النظام آليًّا مع أمر مقابل، فتُقيّد الصفقة فورًا</li><li><b>المقاصة والتسوية:</b> «مقاصة» تحتسب الالتزامات وتضمنها، و«إيداع» ينقل الملكية خلال T+2</li></ol>"],
[3,"الفصل 5","المقاصة والتسوية","<b>المقاصة:</b> تلي التنفيذ وتسبق التسوية؛ تُطابق البيانات ويحدد ما لكل طرف وما عليه بالاحتساب الصافي، وتكون جهة المقاصة <b>طرفًا مقابلًا مركزيًّا</b>.<br><b>التسوية:</b> المرحلة الأخيرة؛ تُسلَّم الأوراق وتُنقل ملكيتها في «إيداع»، ويُسلَّم الثمن للبائع.<br><b>الفرق:</b> المقاصة <b>حساب</b> وتحديد، والتسوية <b>تنفيذ</b>: تنفيذ ← مقاصة ← تسوية."],

// ================= المستوى 4: الإتقان (40) =================
[4,"الفصل 1","النشأة العالمية: ست مراحل","<ol><li>تجمع التجار والصيارفة في المدن الأوروبية لتداول الكمبيالات والديون</li><li>ظهور البورصة بمفهومها المنظم</li><li>ظهور الشركات المساهمة وتداول الأسهم</li><li>توسع إصدار السندات الحكومية</li><li>التنظيم والرقابة بعد الأزمات المالية الكبرى</li><li>المشتقات والتداول الإلكتروني وترابط الأسواق</li></ol>"],
[4,"الفصل 1","تواريخ السوق السعودية","<table><tr><td>1354هـ / 1934م</td><td>أول شركة مساهمة: الشركة العربية للسيارات</td></tr><tr><td>1404هـ / 1984م</td><td>لجنة وزارية، والإشراف لمؤسسة النقد</td></tr><tr><td>1410هـ / 1990م</td><td>أول نظام تداول إلكتروني</td></tr><tr><td>1421هـ / 2001م</td><td>إطلاق نظام «تداول»</td></tr><tr><td>2/6/1424هـ</td><td>نظام السوق بالمرسوم (م/30) وإنشاء الهيئة</td></tr><tr><td>1428هـ / 2007م</td><td>تأسيس شركة تداول</td></tr><tr><td>2017م · 1442هـ</td><td>إطلاق «نمو» · طرح مجموعة تداول</td></tr></table>"],
[4,"الفصل 1","الحاضرة والآجلة · ونوع الأداة","<b>السوق الحاضرة (العاجلة):</b> يُتفق فيها على الصفقة وتُنفذ بالتسليم والتسلم فورًا أو خلال دورة التسوية، وتنقسم بحسب الأجل إلى أسواق نقد ورأس مال.<br><b>السوق الآجلة (المشتقات):</b> يُبرم العقد الآن ويؤجل التسليم والدفع.<br><b>التقسيم الرابع بنوع الأداة:</b> أسهم، دين (سندات وصكوك)، عملات (صرف أجنبي)، سلع، مشتقات."],
[4,"الفصل 1","الحكم الشرعي للتقسيمات","لا إشكال في التقسيم ذاته؛ فالأولية والثانوية والمنظمة وغير المنظمة <b>أطر للتعامل</b>، وإنما يتوجه الحكم إلى <b>محل التعامل وطريقته</b>.<br>• سوق النقد التقليدية: أدواتها ربوية غالبًا، وبدائلها الصكوك القصيرة وصناديق المرابحة.<br>• سوق رأس المال: بحسب الأداة.<br>• السوق الآجلة: قائمة غالبًا على عقود يؤجل فيها البدلان."],
[4,"الفصل 1","الأولية مقابل الثانوية","<table><tr><th></th><th>الأولية</th><th>الثانوية</th></tr><tr><td>المحل</td><td>أوراق تُصدر أول مرة</td><td>أوراق سبق إصدارها</td></tr><tr><td>الطرفان</td><td>المُصدر والمكتتب</td><td>المستثمرون بينهم</td></tr><tr><td>مآل الثمن</td><td>إلى المُصدر</td><td>إلى البائع</td></tr><tr><td>الوظيفة</td><td>التمويل وتكوين رأس المال</td><td>السيولة والتسعير</td></tr><tr><td>المثال</td><td>الاكتتاب العام</td><td>التداول اليومي</td></tr></table>"],
[4,"الفصل 2","أدوات الملكية وأدوات الدين","<table><tr><th></th><th>الملكية (الأسهم والوحدات)</th><th>الدين (السندات، والصكوك في التصنيف)</th></tr><tr><td>الطبيعة</td><td>حق ملكية في المُصدر</td><td>التزام على المُصدر</td></tr><tr><td>الأجل</td><td>تنتهي بتصفية المُصدر</td><td>آجال وتاريخ إطفاء</td></tr><tr><td>المخاطر</td><td>أعلى وعائد أعلى غالبًا</td><td>أقل (ائتمانية) وعائد أقل</td></tr></table>"],
[4,"الفصل 2","حقوق الأسهم العادية","<ul><li>نصيب من الأرباح الموزعة بقدر الحصة</li><li>حضور الجمعية العامة والتصويت وانتخاب المجلس</li><li>الأولوية في الاكتتاب بالأسهم الجديدة</li><li>الاطلاع على الدفاتر، والتصرف في السهم</li><li>نصيب من الموجودات عند التصفية بعد سداد الديون</li></ul><b>تصدر</b> عند التأسيس وزيادة رأس المال، و<b>تُتداول</b> في السوق الرئيسية أو الموازية «نمو»."],
[4,"الفصل 2","الأسهم القابلة للاسترداد","أسهم تصدرها الشركة قابلة للاسترداد بخيار الشركة ووفق شروطها، و<b>فائدتها</b> مرونة رفع رأس المال مدة ثم تخفيضه.<br><b>حكمها:</b> <span class='ok'>جائزة</span> ما لم تتضمن امتيازًا محظورًا؛ لأن الاسترداد <b>خيار</b> للشركة لا التزام عليها فلا ضمان، ولا ترد شبهة <b>العينة</b> لأن الإصدار والاسترداد كلاهما بعوض حالّ."],
[4,"الفصل 2","صور امتيازات الأسهم الممتازة","<ol><li>نسبة ثابتة من الأرباح إن تحقق ربح: <b>20%</b> لها و80% للعادية</li><li>نسبة أكبر من الربح: <b>1.5</b> للممتاز مقابل 1 للعادي</li><li>الأولوية في استرداد القيمة عند التصفية</li><li>عائد ثابت مضمون في الأنظمة التقليدية</li></ol><b>لماذا تُصدر؟</b> لجذب ممولين عند زيادة رأس المال دون التنازل عن التصويت أو إدخال شركاء مؤثرين. وهي نادرة في السوق السعودية."],
[4,"الفصل 2","لا تخلط: مذاهب قسمة الربح","الامتياز في قسمة الربح المتحقق دون ضمان أجازته المعايير الشرعية، وهو مذهب <b>الحنفية والحنابلة</b> (قسمة الربح بحسب الاتفاق)، <b>خلافًا للمالكية والشافعية</b>.<br>ومنعه ظاهر قرار المجمع 63 الذي منع تقديمها «عند توزيع الأرباح».<br>ولا بأس بالامتياز في الأمور <b>الإجرائية والإدارية</b>."],
[4,"الفصل 2","تنبيه وترجيح في المختلطة","• القول بالجواز <b>لا يعني</b> جواز المحرم إذا قلّت نسبته؛ فالربا محرم كله، والإثم على من رضي به من القائمين على الشركة، وإنما جاز تملك السهم لاختلاط الحلال الغالب بحرام يسير يمكن استبعاده.<br>• يجب على صاحب الحصة المؤثرة في التصويت أن يمنع المحرم.<br>• <b>الراجح:</b> الثاني هو المعمول به، والأول قول المجامع، و<b>الأحوط</b> الاقتصار على النقية."],
[4,"الفصل 2","تداول الأوراق: أعيان أو ديون محضة","<b>أعيان ومنافع وحقوق:</b> يجوز التداول دون مراعاة أحكام الصرف وبيع الدين، كصكوك الإجارة والصناديق العقارية.<br><b>نقود أو ديون محضة:</b> لا يجوز إلا بأحكام الصرف أو بيع الدين، كصكوك المرابحة بعد البيع. ونادرة في الأسهم؛ فإن لم تبدأ الشركة نشاطها وموجوداتها نقود فقط فلا تُتداول إلا <b>بالقيمة الاسمية مع التقابض</b>."],
[4,"الفصل 2","لا تخلط: التبعية والأغلبية","في الموجودات المختلطة:<br><b>قاعدة التبعية «التابع تابع»</b> ← في كيان ذي <b>نشاط مستمر</b> تُقلَّب موجوداته (الأسهم، الوحدات، صكوك المضاربة والمشاركة والوكالة): يجوز التداول <b>مهما كانت</b> نسبة النقود والديون متى بدأ النشاط (معيار بيع الدين).<br><b>قاعدة الأغلبية «للأكثر حكم الكل»</b> ← في <b>أصول معينة لا تُقلَّب</b> (صكوك الإجارة والمرابحة، محافظ التمويل): يجوز إن زادت الأعيان والمنافع على <b>50%</b>."],
[4,"الفصل 2","المضاربة في الأسهم","<b>تعريفها:</b> البيع والشراء بقصد الربح من فروق الأسعار في المدى القصير، ومنها اليومية. وهي غير <b>المضاربة الفقهية (القراض)</b>.<br><b>حكمها:</b> <span class='ok'>جائزة</span> في الأسهم المباحة؛ والقيد في المحفظة قبض حكمي.<br><b>ضوابطها:</b> أسهم مباحة، وتعامل حاضر لا بالهامش الربوي ولا بالمكشوف، ودون تلاعب أو نجش بأوامر وهمية أو إشاعات أو معلومات داخلية."],
[4,"الفصل 2","حق الأولوية: الخيارات والمثال والتكييف","<b>خيارات المساهم:</b> ① الاكتتاب بكامل حقوقه ② بيعها كلها أو بعضها ③ شراء حقوق إضافية والاكتتاب بها ④ عدم التصرف، فتُطرح في الطرح المتبقي ويُعوَّض بالفرق.<br><b>مثال:</b> سهم جديد لكل 5 بسعر 10، وإغلاق السهم 37 ← سعر افتتاح الحق = 37 − 10 = <b>27</b>.<br><b>تكييفه:</b> مال معلوم متقوم، ولا يُشترط أن يكون المعقود عليه عينًا أو منفعة، كالاعتياض عن <b>حقوق الارتفاق</b> (المرور والمسيل)."],
[4,"الفصل 2","قرار المجمع في السندات","نص قرار المجمع <b>60 (6/11)</b>: «السندات التي تمثل التزامًا بدفع مبلغها مع فائدة منسوبة إليه أو نفع مشروط محرمة شرعًا من حيث الإصدار أو الشراء أو التداول؛ لأنها قروض ربوية، سواء أكانت الجهة المُصدرة لها خاصة أم عامة ترتبط بالدولة».<br>ولا أثر لتسميتها شهادات أو صكوكًا. وقول من أجاز الحكومية بحجة الحاجة <b>مرجوح</b>."],
[4,"الفصل 2","الأسهم · الصكوك · السندات","<table><tr><th></th><th>الأسهم</th><th>الصكوك</th><th>السندات</th></tr><tr><td>الحامل</td><td>شريك</td><td>مالك بحسب العقد</td><td>دائن</td></tr><tr><td>الأجل</td><td>دائم</td><td>محدد، بالإطفاء</td><td>محدد، بالاستحقاق</td></tr><tr><td>المخاطرة</td><td>أعلى</td><td>أقل، بالأصل</td><td>ائتمان فقط</td></tr><tr><td>الإدارة</td><td>تصويت</td><td>لا حق</td><td>—</td></tr><tr><td>الاسترداد</td><td>بالبيع فقط</td><td>بشراء الأصول</td><td>برد القيمة الاسمية</td></tr><tr><td>المُصدر</td><td>شركة مساهمة</td><td>عبر شركة ذات غرض خاص</td><td>حكومة أو شركة</td></tr></table>"],
[4,"الفصل 2","تداول صكوك المرابحة","<ul><li><b>قبل شراء السلعة</b> (الحصيلة نقود): يخضع تداولها لأحكام الصرف</li><li><b>بعد شرائها وقبل بيعها:</b> <span class='ok'>يجوز</span>؛ لأنها أعيان مملوكة</li><li><b>بعد بيعها للمشتري:</b> <span class='no'>لا يجوز</span> بيعًا وشراءً بالنقد؛ لأنها دين في ذمة المشتري، وبيع الدين بنقد متفاضل ربا. ويجوز إصدارها ابتداءً لكنها لا تُتداول</li></ul>"],
[4,"الفصل 2","تداول صكوك المضاربة","<ul><li>تمثل حصصًا في وعاء ذي <b>نشاط مستمر</b>، فيجوز تداولها بعد بدء النشاط بالسعر المتراضى عليه، عملًا بقاعدة التبعية مهما كانت نسبة النقود والديون</li><li><b>قبل بدء النشاط:</b> مبادلة نقد بنقد، فتطبق أحكام الصرف (المجمع 30)</li><li>لا يضمن المضارب إلا بالتعدي أو التقصير، ويجوز أن <b>يتبرع طرف ثالث منفصل</b> بجبر الخسارة (المجمع 30)</li></ul>"],
[4,"الفصل 2","الصكوك المركبة ومرجعية الصكوك","<b>المركبة:</b> تجمع المرابحة (الدين) وعقد ملكية كالإجارة أو المضاربة؛ <b>غرضها</b> التوفيق بين تقليل المخاطر وإتاحة التداول. <b>حكمها:</b> جائزة بشرط أن تكون المرابحة <b>دون 50%</b>؛ لأن الحكم للأكثر.<br><b>المرجعية:</b> قرار المجمع <b>30 (5/4)</b> في سندات المقارضة، و<b>178 (19/4)</b> في الصكوك، وبيان المجلس الشرعي لأيوفي <b>1429هـ (2008م)</b> في معالجة ممارسات قرّبتها من السندات (ضمان المدير، والتعهد بالشراء بالقيمة الاسمية)."],
[4,"الفصل 2","فترات الإتاحة في الصناديق","<table><tr><th></th><th>الاشتراك</th><th>الاسترداد</th><th>التداول</th></tr><tr><td>مفتوح غير متداول</td><td>أيام التقييم (يومان أسبوعيًّا على الأقل)</td><td>أيام التقييم</td><td>لا يُتداول</td></tr><tr><td>مغلق غير متداول</td><td>الطرح الأولي فقط</td><td>لا قبل انتهاء مدته</td><td>محدود عبر المدير</td></tr><tr><td>متداول (الريت)</td><td>الطرح الأولي</td><td>لا يُسترد</td><td>طوال ساعات السوق</td></tr></table>"],
[4,"الفصل 2","صافي قيمة الأصول","الاشتراك والاسترداد في الصناديق المفتوحة على أساس <span class='k'>صافي قيمة الأصول</span>:<br>(القيمة السوقية لأصول الصندوق − المصروفات والالتزامات المستحقة كأجر المدير ورسوم الحفظ) ÷ عدد الوحدات.<br>ولا يتأثر سعر الوحدة بالاشتراك أو الاسترداد؛ لأن زيادة الأصول أو نقصها يقابلها زيادة عدد الوحدات أو نقصها."],
[4,"الفصل 2","حكم الصناديق بحسب مجالها (1)","<ul><li><b>أسواق النقد:</b> المتوافقة (مرابحات وصكوك وودائع إسلامية) <span class='ok'>جائزة</span>، وغيرها (ودائع ربوية، ريبو، سندات) <span class='no'>محرمة</span></li><li><b>أدوات الدين:</b> ما يستثمر في الصكوك <span class='ok'>جائز</span>، وفي السندات <span class='no'>محرم</span></li><li><b>الأسهم:</b> بحسب أحكام الأسهم (نقية، محرمة، مختلطة)</li><li><b>الملكية الخاصة:</b> <span class='ok'>جائزة</span> إذا تحققت الضوابط في أصولها</li></ul>"],
[4,"الفصل 2","الريت وصناديق الذهب","<b>الريت (العقارية المتداولة):</b> <span class='ok'>جائزة</span> استثمارًا وتداولًا؛ لأنها أصول عقارية مؤجرة، وتلزم اللائحة بتوزيع <b>90%</b> على الأقل من صافي الربح. والعقار المؤجر لنشاط محرم يجري فيه خلاف المختلطة.<br><b>الذهب:</b> الوحدات التي تمثل ذهبًا غير معين (<b>Unallocated</b>) <span class='no'>محرمة</span> لعدم تحقق القبض، والتي تمثل سبائك معينة بأرقامها (<b>Allocated</b>) بشهادة يوم العقد تخول القبض <span class='ok'>جائزة</span> (معيار الذهب)."],
[4,"الفصل 2","أذون الخزانة بالتفصيل","<b>مدتها:</b> 3 أو 6 أو 12 شهرًا، وتصدرها وزارة المالية أو البنك المركزي.<br><b>مثال:</b> اسمية 100 ألف لسنة تُباع بـ96 ألفًا ← العائد 4 آلاف = (4,000 ÷ 96,000) × 100 ≈ <b>4.17%</b>.<br><b>خصائصها:</b> قصيرة، منخفضة المخاطر، عالية السيولة، بلا كوبون، تصدر بالمزاد.<br><b>الغرض:</b> للحكومة سد العجز المؤقت وتنفيذ السياسة النقدية (سحب السيولة ببيعها وضخها بشرائها)، وللمستثمر أداة آمنة سريعة التسييل."],
[4,"الفصل 2","حكم الأذون والشهادات وبدائلهما","<b>أذون الخزانة:</b> <span class='no'>محرمة</span>؛ قرض للحكومة بزيادة، ولا يغير الحكم كونها خصمًا (عموم قرار المجمع 60). <b>البديل:</b> صكوك حكومية قصيرة (إجارة، سلم، مرابحة).<br><b>شهادات الإيداع:</b> <span class='no'>محرمة</span>؛ قرض للبنك بفائدة، والودائع قروض (المجمع <b>86 (3/9)</b>). ظهرت القابلة للتداول في أمريكا <b>1961م</b>. <b>البديل:</b> شهادات الاستثمار على المضاربة أو الوكالة."],
[4,"الفصل 3","مثال الشراء بالهامش","مستثمر معه <b>1,000</b> ريال، والسهم بـ<b>20</b>:<br>• نقدًا يشتري 50 سهمًا، وبهامش 50% يشتري 100.<br>• إن ارتفع إلى 25: ربح نقدًا <b>250</b>، وبالهامش <b>500</b> قبل تكلفة التمويل.<br>• وإن انخفض كانت الخسارة مضاعفة كذلك.<br>فالهامش <b>يضاعف الربح والخسارة</b>، ويستفيد الوسيط ربح التمويل وعمولات التداول."],
[4,"الفصل 3","المكشوف: المثال والبديل","<b>مثال:</b> اقترض 100 سهم وباعها بـ30 (3,000 مرهونة)، فانخفض إلى 20 فاشتراها بـ2,000 وردها فربح 1,000. ولو ارتفع إلى 40 خسر 1,000، وخسارته <b>غير محدودة نظريًّا</b>. والتوزيعات خلال القرض للمقرض.<br><b>البديل المقترح:</b> يشتري المستثمر الأسهم بثمن مؤجل (90 يومًا)، مع وعد من طرف واحد ببيع مثلها بثمن متفق عليه ثم المقاصة؛ بشرط أن يكون الوعد <b>غير ملزم بإبرام العقد</b>، ويتحمل المخل الضرر الفعلي."],
[4,"الفصل 3","لا تخلط: الهامش والمكشوف","<table><tr><th></th><th>الشراء بالهامش</th><th>البيع على المكشوف</th></tr><tr><td>التوقع</td><td>ارتفاع السعر</td><td>انخفاض السعر</td></tr><tr><td>ما يقترضه</td><td>نقودًا</td><td>أسهمًا</td></tr><tr><td>أقصى خسارة</td><td>قيمة الهامش وزيادة</td><td>غير محدودة نظريًّا</td></tr><tr><td>علة التحريم</td><td>القرض بفائدة، والقرض الذي جر نفعًا</td><td>بيع ما لا يُملك، والقرض الذي جر نفعًا</td></tr></table>"],
[4,"الفصل 4","العقود الآجلة بالتفصيل","<b>خصائصها:</b> غير نمطية بالتفاوض، خارج الأسواق المنظمة غالبًا، ملزمة للطرفين ولا تُتداول، فيها مخاطر الطرف المقابل، وتُسوى بالتسليم أو بدفع الفرق.<br><b>مثال:</b> شركة تتفق مع بنك على شراء مليون دولار بعد 3 أشهر بـ<b>3.76</b> دون دفع شيء الآن.<br><b>حكمها:</b> <span class='no'>محرمة</span>؛ ابتداء الدين بالدين، وفي العملات تخالف التقابض. <b>ويُستثنى:</b> السلم، والاستصناع، والمواعدة غير الملزمة أو الوعد الملزم من طرف واحد."],
[4,"الفصل 4","الآجلة مقابل المستقبلية","<table><tr><th></th><th>الآجلة</th><th>المستقبلية</th></tr><tr><td>المكان</td><td>خارج السوق غالبًا</td><td>سوق منظمة</td></tr><tr><td>الشروط</td><td>بالتفاوض</td><td>نمطية</td></tr><tr><td>الطرف المقابل</td><td>مخاطره قائمة</td><td>تزيلها المقاصة</td></tr><tr><td>الهامش</td><td>لا يُشترط غالبًا</td><td>مبدئي وتسوية يومية</td></tr><tr><td>التداول</td><td>لا يُتداول عادة</td><td>يُتداول بسهولة</td></tr><tr><td>الانتهاء</td><td>بالتسليم غالبًا</td><td>بعقد معاكس غالبًا</td></tr></table>"],
[4,"الفصل 4","أنواع الخيارات ومثالها","<ul><li><b>الحق:</b> شراء (Call) · بيع (Put) · مركب</li><li><b>وقت التنفيذ:</b> الأمريكي في أي وقت حتى الانتهاء · الأوروبي في تاريخ الانتهاء فقط</li><li><b>الأصل:</b> أسهم، سندات، عملات، مؤشرات</li><li><b>ملك المحرر:</b> مغطى إن ملك الأصل · مكشوف إن لم يملك</li></ul><b>مثال:</b> سهم بـ48، خيار شراء بتنفيذ 48 لـ90 يومًا بعلاوة 2: إن ارتفع إلى 54 ربح 6 وصافيه <b>4</b>، وإلا خسر الريالين فقط."],
[4,"الفصل 4","الخيار المركب والبدائل","<b>الخيار المركب:</b> يجمع الشراء والبيع، بحد أعلى وأدنى لسعر التنفيذ. <span class='no'>محرم على القولين</span>؛ لأن العاقد يتردد بين كونه بائعًا أو مشتريًا.<br><b>ضوابط المجيزين للمفرد:</b> أسهم متوافقة · حق حالّ · تسليم فعلي لا تسوية نقدية · مقدور على تسليمها · خيار الشراء مغطى.<br><b>البدائل:</b> <b>بيع العربون</b> (المجمع 72 (3/8) بمدة محدودة) وهو في بيع قائم لسلعة مملوكة لا في حق مجرد، ولا يجري في الصرف والسلم · <b>خيار الشرط</b> بلا مقابل مستقل."],
[4,"الفصل 4","المبادلات الأربع","<table><tr><td>أسعار الفائدة</td><td>قروض ربوية، ومراهنة على اتجاه الفائدة</td></tr><tr><td>العملات</td><td>قرضان متقابلان «أسلفني وأسلفك» بفوائد، وصرف مؤجل</td></tr><tr><td>مخاطر الائتمان</td><td>ضمان بأجر، والضمان من عقود الإرفاق، وفيها غرر ومقامرة</td></tr><tr><td>السلع والأسهم</td><td>مقامرة على فروق الأسعار دون تملك</td></tr></table>كلها <span class='no'>محرمة</span>، و<b>البديل:</b> الوعد من طرف واحد، والمرابحات المتوازية."],
[4,"الفصل 5","الأوامر والمطابقة وحكمها","<b>الأوامر:</b> السوق (فوري بأفضل سعر) · المحدد (بسعره أو أفضل) · الإيقاف (يصير أمر سوق عند حد) · الإيقاف المحدد (يصير أمرًا محددًا). ومدةً: يومي، حتى تاريخ، مفتوح.<br><b>المطابقة:</b> أولوية <b>السعر</b> ثم <b>الوقت</b>.<br><b>الحكم:</b> إدخال الأمر إيجاب، ومطابقته قبول (المجمع <b>52 (3/6)</b>)، والأوامر وكالة مقيدة <span class='ok'>جائزة</span>، ويحرم التلاعب والنجش."],
[4,"الفصل 5","المؤشرات: التكوين والحساب","<b>التكوين:</b> ① العينة (كل الأسهم كـ«تاسي»، أو مختارة كـ«إم تي 30») ② الترجيح: بالسعر (داو جونز)، أو بالقيمة السوقية وهو الأشيع (S&amp;P 500)، أو متساوٍ ③ الأساس (1000 نقطة لتاسي، 1985م) ④ المعادلة.<br><b>نسبة التغير</b> = (التغير بالنقاط ÷ القيمة السابقة) × 100: من 11,000 إلى 11,220 = +2%، ثم إلى 10,995 = −2.01%.<br><b>الحكم:</b> إنشاؤه <span class='ok'>جائز</span>، وبيعه <span class='no'>محرم</span> «مقامرة بحتة» (المجمع 63)."],
[4,"الفصل 6","الهيئة ولجان المنازعات","<b>الهيئة:</b> بالمرسوم (م/30) في 2/6/1424هـ، مستقلة ماليًّا وإداريًّا، ترتبط برئيس مجلس الوزراء، ومجلسها <b>5 أعضاء</b> متفرغين بأمر ملكي. مهامها: التنظيم واللوائح، حماية المستثمرين، العدالة والشفافية، تنظيم الإصدار والإفصاح، الترخيص.<br><b>لجان المنازعات:</b> ① <b>الفصل:</b> مستشارون بقرار مجلس الهيئة ② <b>الاستئناف:</b> بقرار مجلس الوزراء، وقراراتها نهائية."],
[4,"الفصل 6","الأعمال الخمسة وأجور المدير","<table><tr><td>التعامل</td><td>وكالة بأجر أو بيع لحسابه</td></tr><tr><td>الإدارة</td><td>وكالة بأجر أو مضاربة، بلا ضمان</td></tr><tr><td>الترتيب</td><td>إجارة على عمل</td></tr><tr><td>المشورة</td><td>إجارة على عمل معلوم</td></tr><tr><td>الحفظ</td><td>إجارة، والحافظ أمين</td></tr></table><b>أجور المدير:</b> رسم الاشتراك جائز · رسوم الإدارة نسبة من صافي الأصول (وكالة بأجر؛ أجازها الحنابلة ومنعها الجمهور، والراجح الجواز) · حافز الأداء جائز إن انضبط."],
[4,"الفصل 6","التعهد بالتغطية","<b>تعريفه:</b> الالتزام بشراء ما لم يُكتتب فيه من الأوراق المطروحة أو جزء منه، في السوق الأولية مرة واحدة.<br><b>بلا مقابل:</b> <span class='ok'>جائز</span> (المجمع 63 والمعايير).<br><b>بمقابل:</b> <span class='kh'>خلاف</span>: التحريم (المعايير؛ الالتزام ليس مالًا متقومًا ويشبه الأجر على الكفالة)، والجواز (لجنة بنك البلاد، واللجنة الشرعية للبنك الأهلي).<br><b>الراجح (المحرر):</b> الجواز؛ عوض عن التزام بعقد معلوم ليس قرضًا."],
[4,"الفصل 6","صانع السوق مقابل متعهد التغطية","<table><tr><th></th><th>صانع السوق</th><th>متعهد التغطية</th></tr><tr><td>السوق</td><td>الثانوية</td><td>الأولية</td></tr><tr><td>الالتزام</td><td>مستمر بعرض أسعار</td><td>مرة واحدة بشراء المتبقي</td></tr><tr><td>الهدف</td><td>السيولة وتقليل التقلب</td><td>نجاح الاكتتاب</td></tr><tr><td>الربح</td><td>فرق العرض والطلب</td><td>أجر التعهد والأعمال</td></tr><tr><td>المُصدر</td><td>لا علاقة غالبًا</td><td>متعاقد معه</td></tr></table>"]
];

const KEY='financial-markets-5205-cards-v1';
LEVELS.forEach(l=>{l.cards=C.filter(c=>c[0]===l.n).map((c,i)=>({id:`L${l.n}-${i+1}`,ch:c[1],t:c[2],b:c[3]}));l.total=l.cards.length;});
const ALL=LEVELS.reduce((s,l)=>s+l.total,0);
let S={done:{},level:1,order:{},cur:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let hist=[];let showFinish=false;
const $=id=>document.getElementById(id);
const L=n=>LEVELS[n-1];
const doneIn=n=>L(n).cards.filter(c=>S.done[c.id]).length;
const complete=n=>doneIn(n)===L(n).total;
const unlocked=n=>true; // كل المستويات مفتوحة
function order(n){let o=S.order[n];const ids=L(n).cards.map(c=>c.id);if(!o||o.length!==ids.length||!ids.every(i=>o.includes(i))){o=ids.slice();S.order[n]=o;}return o;}
function nextId(n){return order(n).find(id=>!S.done[id]);}
function card(id){for(const l of LEVELS){const c=l.cards.find(x=>x.id===id);if(c)return c;}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);}
function renderTop(){
 const d=Object.keys(S.done).filter(k=>S.done[k]).length;
 $('totTxt').textContent=`${d} / ${ALL}`;$('totBar').style.width=(d/ALL*100)+'%';
 $('levels').innerHTML=LEVELS.map(l=>{const dn=doneIn(l.n),lk=!unlocked(l.n),cm=complete(l.n);
  return `<button class="lv ${S.level===l.n?'on':''} ${lk?'lock':''}" data-l="${l.n}">${cm?'<span class="badge">✓</span>':''}<b>${lk?'🔒 ':''}المستوى ${l.n}<br>${l.name}</b><span>${dn} / ${l.total}</span><div class="mini"><i style="width:${dn/l.total*100}%"></i></div></button>`}).join('');
 document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{const n=+b.dataset.l;if(!unlocked(n)){toast('أكمل المستوى السابق أولًا');return;}S.level=n;S.cur[n]=null;hist=[];showFinish=false;save();render();});
}
function render(){
 renderTop();const n=S.level,lv=L(n);
 let id=S.cur[n];
 if(!showFinish&&(!id||!card(id)||(S.done[id]&&!hist.length&&nextId(n)))){id=nextId(n);}
 if(showFinish||!id){S.cur[n]=null;save();
  const last=n===LEVELS.length;
  $('stage').innerHTML=`<div class="card"><div class="strip"></div><div class="finish"><div class="em">${last?'🏆':'🎉'}</div><h2>${last?'أتممت المقرر كله!':'أتممت المستوى '+n}</h2><p>${last?'أنهيت 100 بطاقة في المستويات الأربعة. راجع الملخص قبل الاختبار، وارجع إلى أي مستوى متى شئت.':'أنهيت بطاقات «'+lv.name+'». المستوى التالي يتعمق أكثر ويبني على ما فهمته.'}</p>${last?'':'<button class="p" id="goNext">انتقل إلى المستوى التالي ←</button>'}<button class="s" id="review">راجع بطاقات هذا المستوى</button></div></div>`;
  if(!last)$('goNext').onclick=()=>{S.level=n+1;hist=[];showFinish=false;save();render();};
  $('review').onclick=()=>{showFinish=false;hist=[];S.cur[n]=lv.cards[0].id;save();render();};
  return;}
 S.cur[n]=id;save();
 const c=card(id),idx=lv.cards.indexOf(c)+1,isD=!!S.done[id],left=lv.total-doneIn(n);
 $('stage').innerHTML=`<div class="card" id="theCard"><div class="strip"></div><div class="in">
  <div class="meta"><span class="chap">${c.ch}</span><span class="pos">المستوى ${n} · بطاقة ${idx} من ${lv.total}</span></div>
  ${isD?'<span class="done-tag">✓ منجزة</span>':''}
  <h2>${c.t}</h2><div class="body">${c.b}</div>
  <div class="actions"><button id="ok">${isD?'التالية ←':'✓ تم، فهمتها'}</button><button id="later">${isD?'إلغاء تم':'لاحقًا'}</button></div>
  <div class="sub"><button id="prev" ${hist.length?'':'disabled'}>→ السابقة</button><span>${left?'بقي '+left+' في هذا المستوى':'اكتمل المستوى ✓'}</span></div>
 </div></div>`;
 $('ok').onclick=()=>{if(!isD){S.done[id]=true;toast(['أحسنت 👏','ممتاز ✨','رائع، تابع 💪','بارك الله فيك 🌿'][Math.floor(Math.random()*4)]);}
  hist.push(id);let nx=nextId(n);if(!nx&&isD){const k=lv.cards.indexOf(c);nx=lv.cards[k+1]?lv.cards[k+1].id:null;}if(!nx){showFinish=true;}else S.cur[n]=nx;save();render();window.scrollTo({top:0,behavior:'smooth'});};
 $('later').onclick=()=>{if(isD){delete S.done[id];save();render();return;}
  const o=order(n);o.splice(o.indexOf(id),1);o.push(id);hist.push(id);S.cur[n]=nextId(n);save();toast('أُجّلت إلى آخر الدور');render();};
 $('prev').onclick=()=>{const p=hist.pop();if(p){S.cur[n]=p;showFinish=false;save();render();}};
}
function openSheet(){const n=S.level,lv=L(n);$('sheetTitle').textContent=`المستوى ${n}: ${lv.name} (${doneIn(n)}/${lv.total})`;
 $('list').innerHTML=lv.cards.map((c,i)=>`<div class="it ${S.done[c.id]?'d':''} ${S.cur[n]===c.id?'cur':''}" data-id="${c.id}"><span class="st">${S.done[c.id]?'✓':i+1}</span><div>${c.t}<small>${c.ch}</small></div></div>`).join('');
 document.querySelectorAll('.it').forEach(e=>e.onclick=()=>{const cur=S.cur[n];if(cur)hist.push(cur);S.cur[n]=e.dataset.id;showFinish=false;save();closeSheet();render();});
 $('confirm').classList.remove('show');$('sheet').classList.add('open');$('sheetBg').classList.add('open');}
function closeSheet(){$('sheet').classList.remove('open');$('sheetBg').classList.remove('open');}
$('menuBtn').onclick=openSheet;$('closeSheet').onclick=closeSheet;$('sheetBg').onclick=closeSheet;
$('resetBtn').onclick=()=>$('confirm').classList.add('show');$('no').onclick=()=>$('confirm').classList.remove('show');
$('yes').onclick=()=>{const n=S.level;L(n).cards.forEach(c=>delete S.done[c.id]);delete S.order[n];S.cur[n]=null;
 hist=[];showFinish=false;save();closeSheet();toast('أُعيد تعيين المستوى');render();};

/* ===== رابط التقدم: يُكتب التقدم والموضع في الرابط، فيعود الدارس إلى مكانه ولو مُسح حفظ المتصفح ===== */
const PROG=(()=>{const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
 const lvOf=id=>+String(id).split('-')[0].slice(1);
 function enc(){const ids=P.ids(),d=P.done();let s='';for(let i=0;i<ids.length;i+=6){let v=0;for(let j=0;j<6;j++)if(d[ids[i+j]])v|=1<<j;s+=A[v];}
  const c=P.cur();return 'p='+s+'&l='+P.level()+(c?'&c='+c:'');}
 function sync(){try{window.history.replaceState(null,'','#'+enc());}catch(e){}}
 function load(){let start=null;try{const m={};(location.hash||'').replace(/^#/,'').split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0)m[kv.slice(0,i)]=kv.slice(i+1);});
  if(!m.p)return null;const ids=P.ids(),d=P.done(),before=ids.filter(i=>d[i]).length;let fromLink=0;
  for(let i=0;i<ids.length;i++){const v=A.indexOf(m.p[Math.floor(i/6)]||'A');if(v>=0&&(v>>(i%6))&1){fromLink++;d[ids[i]]=true;}}
  if(fromLink>=before){if(m.c&&ids.includes(m.c)){P.go(lvOf(m.c),m.c);start=m.c;}else if(+m.l>=1&&+m.l<=4)P.go(+m.l,null);}
  P.save();}catch(e){}return start;}
 function copy(){const url=location.href.split('#')[0]+'#'+enc();const ok=()=>toast('نُسخ الرابط ✓ احفظه في المفضلة أو أرسله لنفسك');
  const fb=()=>{const t=document.createElement('textarea');t.value=url;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
   let done=false;try{done=document.execCommand('copy');}catch(e){}t.remove();if(done)ok();else window.prompt('انسخ هذا الرابط واحفظه:',url);};
  try{navigator.clipboard.writeText(url).then(ok,fb);}catch(e){fb();}}
 return {sync,load,copy};})();
const P={ids:()=>LEVELS.flatMap(l=>l.cards.map(c=>c.id)),done:()=>S.done,level:()=>S.level,cur:()=>showFinish?null:S.cur[S.level],go:(l,id)=>{S.level=l;S.cur[l]=id;showFinish=false;},save};
{const _f=render;render=function(...a){const r=_f.apply(this,a);PROG.sync();return r;};}
document.getElementById('progBtn').onclick=()=>PROG.copy();
PROG.load();
render();
</script>
</body>
